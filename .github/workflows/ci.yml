# CI. In the first run (2026-10-08), Swift (macos-15) and Emacs passed, and for core the node --test
# specification for Node 24 was fixed.
# It depends on the Xcode / Swift versions of the available macOS runners, so adjust it in the first run.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check.sh license
      - run: scripts/check.sh version

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: scripts/check.sh core

  protocol:
    runs-on: macos-15 # to also check the Swift component (protocol/swift)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: scripts/check.sh protocol

  swift:
    runs-on: macos-15
    strategy:
      matrix:
        target: [app, cli]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check.sh ${{ matrix.target }}

  emacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - run: scripts/check.sh emacs
