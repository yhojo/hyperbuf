<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HyperBuf</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <div id="frame"></div>
    <div id="minibuffer" hidden>
      <ul id="candidates"></ul>
      <label
        ><span id="prompt-label"></span
        ><input id="prompt-input" autocomplete="off" spellcheck="false" /><span
          id="prompt-count"
        ></span
      ></label>
    </div>
    <div id="echo"></div>
    <div id="status"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
